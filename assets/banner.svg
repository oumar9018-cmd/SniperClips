<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="0.55" stop-color="#16102b"/>
      <stop offset="1" stop-color="#2b0f2e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;2" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;3" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.5" stop-color="#ff5e7a"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#shine)"/>

  <!-- floating sparks -->
  <g fill="#ffd23f">
    <circle cx="120" cy="70" r="3"><animate attributeName="cy" values="70;52;70" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="90" r="2.5"><animate attributeName="cy" values="90;72;90" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="230" r="3"><animate attributeName="cy" values="230;214;230" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.4;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="245" r="2.5"><animate attributeName="cy" values="245;228;245" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="4" fill="url(#title)">
    SNIPERCLIPS
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
  </text>

  <text x="600" y="196" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="29" font-weight="600" fill="#f2f2f7">
    One link in. Viral clips out.
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.5s" fill="freeze"/>
  </text>

  <text x="600" y="242" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#b9b9c9">
    The free, open-source clipper that speaks English AND Hinglish — with a copyright shield.
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1s" fill="freeze"/>
  </text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.5s" fill="freeze"/>
    <rect x="330" y="268" rx="14" width="150" height="30" fill="#ffd23f"/>
    <text x="405" y="289" text-anchor="middle" fill="#14100a">100% FREE</text>
    <rect x="495" y="268" rx="14" width="190" height="30" fill="#ff5e7a"/>
    <text x="590" y="289" text-anchor="middle" fill="#ffffff">OPEN SOURCE</text>
    <rect x="700" y="268" rx="14" width="180" height="30" fill="#8a5cff"/>
    <text x="790" y="289" text-anchor="middle" fill="#ffffff">NO CREDITS</text>
  </g>
</svg>
